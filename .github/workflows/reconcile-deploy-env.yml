name: Reconcile deploy env (Amplify <-> Zappa)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      API_GATEWAY_NAME: gym-tracker-dev
      ZAPPA_STAGE: dev
      AMPLIFY_APP_ID: d3f69wcemgebls
      AMPLIFY_BRANCH_NAME: main
      SSM_PARAMETER_NAME: /gym-tracker/dev/CORS_ALLOWED_ORIGINS
      LAMBDA_FUNCTION_NAME: gym-tracker-dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3

      - name: Debug OIDC token + assume-role (temporary)
        run: |
          echo "token presence: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo yes || echo no)"
          echo "request url: $ACTIONS_ID_TOKEN_REQUEST_URL"
          jwt=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "$jwt" | cut -d. -f2 | python3 -c '
          import sys,base64,json
          p=sys.stdin.read().strip(); p+="="*(-len(p)%4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(p)), indent=2, sort_keys=True))'
          echo "=== AssumeRoleWithWebIdentity attempt ==="
          curl -s --data-urlencode "WebIdentityToken=$jwt" \
            "https://sts.amazonaws.com/?Action=AssumeRoleWithWebIdentity&Version=2011-06-15&RoleArn=arn:aws:iam::214182382176:role/gym-tracker-github-actions&RoleSessionName=debug"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::214182382176:role/gym-tracker-github-actions
          aws-region: us-east-1

      - name: Reconcile deploy environment
        working-directory: backend
        run: python -m scripts.reconcile_deploy_env
